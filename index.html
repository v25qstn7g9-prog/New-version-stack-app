  <meta name="theme-color" content="#171717" id="zaThemeColor" />
  <script>
    /* 外觀主題（只管畫面）：深藍／淺色（霧藍白，key 仍叫 grey）。沒有手動選過就跟著 iPhone 外觀（淺色模式＝淺色、深色模式＝深藍）；
       手動切換只維持到 iPhone 外觀下一次改變為止，所以外觀設成「自動」時白天淺色、晚上深藍會自己切換。舊的 dark／light 值照舊對應。畫面畫出來前先套用，避免閃一下。 */
    (function () {
      var K = "zaTheme", KS = "zaThemeSys", BG = { navy: "#171717", grey: "#F1F0EC" }, root = document.documentElement;
      var mq = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
      function sysTheme() { return mq && !mq.matches ? "grey" : "navy"; }
      function saved() {
        try {
          var v = localStorage.getItem(K); v = (v === "navy" || v === "dark") ? "navy" : (v === "grey" || v === "light") ? "grey" : null;
          if (v && localStorage.getItem(KS) !== sysTheme()) { localStorage.removeItem(K); localStorage.removeItem(KS); return null; }
          return v;
        } catch (e) { return null; }
      }
      function apply(t) {
        root.setAttribute("data-theme", t);
        var m = document.getElementById("zaThemeColor"); if (m) m.setAttribute("content", BG[t]);
        try { window.dispatchEvent(new CustomEvent("za-theme", { detail: t })); } catch (e) {}
      }
      window.zaGetTheme = function () { return root.getAttribute("data-theme") === "grey" ? "grey" : "navy"; };
      window.zaSetTheme = function (t) { t = t === "grey" ? "grey" : "navy"; try { localStorage.setItem(K, t); localStorage.setItem(KS, sysTheme()); } catch (e) {} apply(t); };
      apply(saved() || sysTheme());
      if (mq) { var onSys = function () { try { localStorage.removeItem(K); localStorage.removeItem(KS); } catch (e) {} apply(sysTheme()); }; if (mq.addEventListener) mq.addEventListener("change", onSys); else if (mq.addListener) mq.addListener(onSys); }
    })();
  </script>

    .ai-panel-h .forma-chat-body{display:flex;flex-direction:column;gap:8px;min-width:0}

    html,body,#root { margin:0; min-height:100%; background:#0A0F1C; }
    body { overscroll-behavior-y:none; }
    /* 手機瀏覽器網址列收合/展開時，100vh 會跟著重新計算導致畫面一直跳動；
       改用 100svh（永遠抓最小可視高度，不受網址列狀態影響）比較穩定。
       不支援 svh 的舊瀏覽器會忽略這行，自動退回 Tailwind 原本的 100vh。 */
    .min-h-screen { min-height: 100svh !important; }
    /* AI 助手面板：用 env(keyboard-inset-height)（iOS 15.4+ 原生變數，
       瀏覽器自己回報鍵盤實際高度）當作外層的 padding-bottom。
       中間試過只靠 interactive-widget=resizes-content 讓 65dvh 自己縮小、
       不疊加這個 padding（理論上可以避免鍵盤高度算兩次），但實測後確認
       在這個 PWA 獨立模式下 interactive-widget 沒有真的讓 dvh 跟著鍵盤縮小
       ——鍵盤彈起後面板還是卡在原本大小，所以改回這個已經驗證有效的
       env(keyboard-inset-height) 機制。 */
    /* AI 助手屬於全 App 共用的頂層 modal：
       - 永遠高於底部分頁列，避免導覽列蓋住輸入區。
       - 沒有鍵盤時不預留 keyboard inset，避免 iOS/PWA 殘留 inset 造成底部黑洞。
       - 只有輸入區實際聚焦時才套用鍵盤 inset。 */
    .ai-panel-wrap {
      z-index: 1000 !important;
      padding-bottom: 0;
      overflow: hidden;
      isolation: isolate;
    }
    .ai-panel-wrap:focus-within {
      padding-bottom: max(0px, calc(env(keyboard-inset-height, 0px) - 36px));
    }
    .ai-panel-h {
      height: 65svh;
      max-height: calc(100svh - env(safe-area-inset-top, 0px));
    }
    @supports (height: 65dvh) {
      .ai-panel-h {
        height: 65dvh;
        max-height: calc(100dvh - env(safe-area-inset-top, 0px));
      }
    }
