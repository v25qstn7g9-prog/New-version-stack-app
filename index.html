<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#0A0F1C" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="存股資產追蹤" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <title>存股資產追蹤 V4.6 Personal v2</title>

  <style>
    html,body,#root { margin:0; min-height:100%; background:#0A0F1C; }
    body { overscroll-behavior-y:none; }
    /* 手機瀏覽器網址列收合/展開時，100vh 會跟著重新計算導致畫面一直跳動；
       改用 100svh（永遠抓最小可視高度，不受網址列狀態影響）比較穩定。
       不支援 svh 的舊瀏覽器會忽略這行，自動退回 Tailwind 原本的 100vh。 */
    .min-h-screen { min-height: 100svh !important; }
    /* AI 助手面板：用 env(keyboard-inset-height)（iOS 15.4+ 原生變數，
       瀏覽器自己回報鍵盤實際高度）當作外層的 padding-bottom。
       中間試過只靠 interactive-widget=resizes-content 讓 65dvh 自己縮小、
       不疊加這個 padding（理論上可以避免鍵盤高度算兩次），但實測後確認
       在這個 PWA 獨立模式下 interactive-widget 沒有真的讓 dvh 跟著鍵盤縮小
       ——鍵盤彈起後面板還是卡在原本大小，所以改回這個已經驗證有效的
       env(keyboard-inset-height) 機制。 */
    .ai-panel-wrap { padding-bottom: max(0px, calc(env(keyboard-inset-height, 0px) - 36px)); }
    .ai-panel-h { height: 65svh; }
    @supports (height: 65dvh) {
      .ai-panel-h { height: 65dvh; }
    }
    #boot-error {
      display:none; position:fixed; inset:0; z-index:99999; padding:24px;
      background:#0A0F1C; color:#E9EEF7; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      white-space:pre-wrap; overflow:auto;
    }
    #boot-error h2 { color:#C9A24B; }
  </style>

  <script>
    function showBootError(title, detail) {
      var box=document.getElementById("boot-error");
      if(!box) return;
      box.style.display="block";
      box.textContent="";
      var h=document.createElement("h2");
      h.textContent=title;
      var d=document.createElement("div");
      d.textContent=String(detail||"未知錯誤");
      box.appendChild(h);
      box.appendChild(d);
    }
    window.addEventListener("error", function(e) {
      showBootError("App 載入錯誤", e.message||(e.error&&e.error.message)||"未知錯誤");
    });
    window.addEventListener("unhandledrejection", function(e) {
      showBootError("App 執行錯誤", (e.reason&&e.reason.message)||e.reason||"未知錯誤");
    });
  </script>
</head>
<body>
  <div id="root"></div>
  <div id="boot-error"></div>

  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
