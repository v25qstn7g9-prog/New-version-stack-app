name: Anthropic key check

# Manual diagnostic: calls the Messages API once with the stored
# ANTHROPIC_API_KEY and prints only the HTTP status and Anthropic's error text.
# The key itself is never printed (GitHub also masks it).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Call Anthropic with the stored key
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "ANTHROPIC_API_KEY is empty"; exit 1; fi
          echo "key length: ${#KEY}; prefix: ${KEY:0:11}"
          code=$(curl -sS -o out.json -w '%{http_code}' https://api.anthropic.com/v1/messages \
            -H "x-api-key: $KEY" -H 'anthropic-version: 2023-06-01' -H 'content-type: application/json' \
            -d '{"model":"claude-haiku-5-5","max_tokens":16,"messages":[{"role":"user","content":"Say OK"}]}')
          echo "HTTP $code: $(jq -c '{type, error: .error.message, text: .content[0].text}' out.json)"
