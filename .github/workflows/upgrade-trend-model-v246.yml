name: upgrade-trend-model-v246

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/upgrade-trend-model-v246.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Upgrade adaptive tomorrow model
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          replacements = [
            (
              'const TREND_RADAR_VERSION = "2.45";\nconst TREND_MODEL_VERSION = "2.45-fast-micro-rvol-breadth-vwap";',
              'const TREND_RADAR_VERSION = "2.46";\nconst TREND_MODEL_VERSION = "2.46-adaptive-night-calibration";'
            ),
            (
              '      if(clock>=630){\n        const previewProgress=Math.max(0,Math.min(1,(clock-630)/(805-630)));\n        const overnightDecay=1-0.65*previewProgress;\n        const calcTomorrow=({pct,kds,news=0,inst=0,beta=1,micro=null,relative=0,range=null,volumePrice=null,breadth=0.5,breadthSource="holdings"})=>{',
              '''      if(clock>=630){
        // v2.46 adaptive calibration: validated next-day history only scales
        // weights conservatively. Small samples can reduce a bad factor, but
        // cannot flip its sign or aggressively self-fit.
        let calibrationRecords=[];
        try{
          const c=await loadKey("trendRadarTomorrowHistory",{records:[]});
          calibrationRecords=(Array.isArray(c?.records)?c.records:[]).filter(r=>r?.actual&&Number.isFinite(Number(r.actual.pct)));
        }catch(e){}
        const factorCorr=(symbol,key)=>{
          const rows=calibrationRecords.filter(r=>r.symbol===symbol && Number.isFinite(Number(r?.factors?.[key]))).slice(-120);
          if(rows.length<12) return {n:rows.length,corr:0};
          const xs=rows.map(r=>Number(r.factors[key])), ys=rows.map(r=>Number(r.actual.pct));
          const mx=xs.reduce((a,b)=>a+b,0)/xs.length, my=ys.reduce((a,b)=>a+b,0)/ys.length;
          let num=0,dx=0,dy=0;
          for(let i=0;i<xs.length;i++){const a=xs[i]-mx,b=ys[i]-my;num+=a*b;dx+=a*a;dy+=b*b;}
          return {n:rows.length,corr:dx>0&&dy>0?num/Math.sqrt(dx*dy):0};
        };
        const adaptiveScale=(symbol,key)=>{
          const {n,corr}=factorCorr(symbol,key);
          if(n<20) return {n,corr,scale:1};
          const maturity=Math.max(0,Math.min(1,(n-20)/80));
          const scale=corr<0
            ? Math.max(0.55,1-Math.min(0.45,Math.abs(corr)*0.9*maturity))
            : Math.min(1.20,1+Math.min(0.20,corr*0.35*maturity));
          return {n,corr,scale};
        };
        const previewProgress=Math.max(0,Math.min(1,(clock-630)/(805-630)));
        const overnightDecay=1-0.65*previewProgress;
        const calcTomorrow=({symbol="TAIEX",pct,kds,news=0,inst=0,beta=1,micro=null,relative=0,range=null,volumePrice=null,breadth=0.5,breadthSource="holdings"})=>{'''
            ),
            (
              '          const ks=(kds||[]).filter(Boolean).reduce((a,k)=>a+k.bull,0);\n          const overnight=global ? Math.max(-6,Math.min(6,global.combined*0.8*beta*overnightDecay)) : 0;',
              '''          const ks=(kds||[]).filter(Boolean).reduce((a,k)=>a+k.bull,0);
          const overnightCal=adaptiveScale(symbol,"overnight");
          const pctCal=adaptiveScale(symbol,"pct");
          const overnightBase=global ? Math.max(-6,Math.min(6,global.combined*0.8*beta*overnightDecay)) : 0;
          const overnight=overnightBase*overnightCal.scale;
          const absPct=Math.abs(Number(pct)||0);
          const momentumBase=Math.sign(Number(pct)||0)*Math.min(3.5,absPct*1.25);
          const overheat=absPct>1.8 ? -Math.sign(Number(pct)||0)*Math.min(2.2,(absPct-1.8)*1.15) : 0;
          const momentum=(momentumBase+overheat)*pctCal.scale;'''
            ),
            (
              '          const raw=overnight\n            +Math.max(-4,Math.min(4,pct*1.25))',
              '          const raw=overnight\n            +momentum'
            ),
            (
              '          return {probability:p,direction:toLabel(p),phase:clock>=805?"final":clock>=750?"refining":"preview",factors:{overnight,overnightDecay,pct,ks,news,inst,beta,micro:microTerm,relative,range:rangeTerm,vwap:vwapTerm,rvol:rvolTerm,breadth:breadthTerm,evidence}};',
              '''          const sampleN=Math.max(overnightCal.n,pctCal.n);
          const conviction=Math.abs(p-50);
          const confidence=(sampleN>=80&&evidence>=4&&conviction>=10)?"高":(sampleN>=40&&evidence>=3&&conviction>=7)?"中":"低";
          return {probability:p,direction:toLabel(p),confidence,phase:clock>=805?"final":clock>=750?"refining":"preview",factors:{overnight,overnightBase,overnightDecay,pct,momentum,overheat,ks,news,inst,beta,micro:microTerm,relative,range:rangeTerm,vwap:vwapTerm,rvol:rvolTerm,breadth:breadthTerm,evidence},calibration:{sampleN,overnight:overnightCal,pct:pctCal}};'''
            ),
            (
              '        tomorrow.TAIEX=calcTomorrow({\n          pct:indexPct,kds:[marketKd15,marketKd60,marketKdDaily],',
              '        tomorrow.TAIEX=calcTomorrow({\n          symbol:"TAIEX",pct:indexPct,kds:[marketKd15,marketKd60,marketKdDaily],'
            ),
            (
              '          tomorrow[r.symbol]=calcTomorrow({\n            pct:r.stockPct,kds:[r.kd15,r.kd60,r.kdDaily],news:r.newsScore,',
              '          tomorrow[r.symbol]=calcTomorrow({\n            symbol:r.symbol,pct:r.stockPct,kds:[r.kd15,r.kd60,r.kdDaily],news:r.newsScore,'
            ),
            (
              '''            if(existingLock?.targetDay===targetDay && existingLock?.predictions){
              Object.entries(existingLock.predictions).forEach(([sym,pred])=>{tomorrow[sym]=pred;});
            }else{
              await saveKey("trendRadarTomorrowLock",{
                targetDay,predictedOn:todayKey,at:now.toISOString(),
                modelVersion:TREND_MODEL_VERSION,predictions:tomorrow
              });
            }

            const tCache=await loadKey("trendRadarTomorrowHistory",{records:[]});
            let tRecords=Array.isArray(tCache?.records)?tCache.records:[];
            const entries=[["TAIEX",tomorrow.TAIEX], ...next.map(r=>[r.symbol,tomorrow[r.symbol]])];''',
              '''            let auditPredictions=null;
            if(existingLock?.targetDay===targetDay && existingLock?.predictions){
              auditPredictions=existingLock.predictions;
              Object.entries(existingLock.predictions).forEach(([sym,pred])=>{tomorrow[sym]={...pred};});
            }else{
              auditPredictions=Object.fromEntries(Object.entries(tomorrow).map(([sym,pred])=>[sym,{...pred}]));
              await saveKey("trendRadarTomorrowLock",{
                targetDay,predictedOn:todayKey,at:now.toISOString(),
                modelVersion:TREND_MODEL_VERSION,globalAtLock:global||null,predictions:auditPredictions
              });
            }

            // 13:25 remains the auditable forecast. After 15:00, show a
            // separate live night-session overlay without rewriting history.
            if(clock>=900 && global){
              const g=(x,k)=>Number.isFinite(Number(x?.[k]))?Number(x[k]):0;
              const nightSignal=(x)=>0.60*g(x,"txfPct")+0.18*g(x,"spxPct")+0.18*g(x,"soxPct")-0.10*g(x,"usdtwdPct");
              const currentNight=nightSignal(global);
              const baseNight=existingLock?.globalAtLock ? nightSignal(existingLock.globalAtLock) : 0;
              const deltaNight=currentNight-baseNight;
              Object.entries(tomorrow).forEach(([sym,pred])=>{
                const b=sym==="TAIEX"?1:betaFor(sym);
                const adj=Math.round(Math.max(-5,Math.min(5,4*Math.tanh((deltaNight*b)/1.25))));
                const np=Math.max(32,Math.min(68,Number(pred.probability||50)+adj));
                tomorrow[sym]={...pred,baseProbability:Number(pred.probability||50),probability:np,direction:toLabel(np),phase:"night",nightAdjustment:adj,nightSignal:currentNight,nightDelta:deltaNight};
              });
            }

            const tCache=await loadKey("trendRadarTomorrowHistory",{records:[]});
            let tRecords=Array.isArray(tCache?.records)?tCache.records:[];
            const entries=[["TAIEX",auditPredictions?.TAIEX||tomorrow.TAIEX], ...next.map(r=>[r.symbol,auditPredictions?.[r.symbol]||tomorrow[r.symbol]])];'''
            )
          ]

          for old, new in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match, got {count}: {old[:120]!r}")
              s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")
          PY

      - name: Run tests
        continue-on-error: true
        run: npm test

      - name: Commit upgrade and remove temporary workflow
        run: |
          rm .github/workflows/upgrade-trend-model-v246.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/upgrade-trend-model-v246.yml
          git commit -m "Upgrade Trend Radar tomorrow model to v2.46 adaptive calibration"
          git push
