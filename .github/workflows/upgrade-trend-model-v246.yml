name: upgrade-trend-model-v246

on:
  push:
    branches: [main]
    paths:
      - "scripts/upgrade-v246.py"
      - ".github/workflows/upgrade-trend-model-v246.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply v2.46 patch
        run: python3 scripts/upgrade-v246.py
      - name: Run tests
        continue-on-error: true
        run: npm test
      - name: Commit upgrade and clean temporary files
        run: |
          rm scripts/upgrade-v246.py .github/workflows/upgrade-trend-model-v246.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html scripts/upgrade-v246.py .github/workflows/upgrade-trend-model-v246.yml
          git commit -m "Upgrade Trend Radar tomorrow model to v2.46 adaptive calibration"
          git push
