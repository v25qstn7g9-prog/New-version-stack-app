name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # 安裝鎖定版本的建置工具（含間接套件），讓「app.js／tw.css 必須和原始碼重新編譯一致」的測試真的跑。
      # 根目錄的 package-lock.json 照 .gitignore 不進 repo；CI 用 ci/package-lock.json（改了 devDependencies 要重產，npm ci 會擋不一致）。
      - run: cp ci/package-lock.json package-lock.json && npm ci --no-audit --no-fund
      - run: npm test
